name: Feature proposal
description: Propose a bounded RP capability
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What player or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - Domain
        - API
        - Simulator
        - Cfx adapter
        - GTA VI adapter
        - Infrastructure
        - UI
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security / abuse considerations
