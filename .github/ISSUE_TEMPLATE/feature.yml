name: Platform feature proposal
description: Propose a testable, game-independent RP feature or public-platform improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Contributor or user need
      description: What reusable RP, simulator, security, or developer experience need should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe behavior and invariants, not an implementation tied to an assumed GTA VI API.
    validations:
      required: true

  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - Account / session
        - Character / identity
        - Economy / ledger
        - Inventory / ownership
        - Jobs / businesses
        - Factions / organizations
        - Vehicles / garages
        - Properties / access
        - Police / justice
        - EMS
        - Communications / phone
        - Moderation / permissions
        - Simulator
        - Persistence / infrastructure
        - Cfx research adapter
        - GTA VI future adapter
        - Internal tooling / UI
    validations:
      required: true

  - type: textarea
    id: authority
    attributes:
      label: Authority and persistence
      description: Which state is authoritative, where it is validated, and what must persist?
    validations:
      required: true

  - type: textarea
    id: runtime
    attributes:
      label: GTA VI runtime dependency
      description: List runtime capabilities required. If none are known, state what remains abstract or blocked.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security / abuse considerations
      description: Identify valuable state, player-controlled inputs, permissions, economic abuse, or moderation impact.
    validations:
      required: true

  - type: checkboxes
    id: scope_gate
    attributes:
      label: Scope gate
      options:
        - label: This change serves a concrete RP platform use case and does not invent a GTA VI integration contract.
          required: true
        - label: Undocumented GTA VI behavior is not treated as confirmed.
          required: true
