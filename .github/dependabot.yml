version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      development-toolchain:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "07:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    rebase-strategy: auto
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
