name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: calm_ci
          POSTGRES_USER: calm_ci
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calm_ci -d calm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate (including live PostgreSQL tests)
        env:
          DATABASE_URL: postgresql://calm_ci:local-ci-only@127.0.0.1:5432/calm_ci
        run: pnpm check

      - name: Build all packages
        run: pnpm build

      - name: Verify repository safeguards
        run: |
          pnpm check:artifacts
          pnpm check:secrets
          pnpm check:site
