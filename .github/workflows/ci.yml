name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Validate and show formatting diff
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm exec prettier --write packages/core/src/index.ts tests/architecture.test.ts
          git diff -- packages/core/src/index.ts tests/architecture.test.ts
          git diff --exit-code -- packages/core/src/index.ts tests/architecture.test.ts
