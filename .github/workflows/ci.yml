name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Diagnose formatter
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm exec prettier --write tests/repository-hygiene.test.ts
          echo '--- PRETTIER OUTPUT START ---'
          cat tests/repository-hygiene.test.ts
          echo '--- PRETTIER OUTPUT END ---'
          exit 1
