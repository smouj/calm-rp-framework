name: Deploy community site

# Publishes site/ to GitHub Pages.
#
# IMPORTANT: GitHub Pages for a private repository requires a paid GitHub plan, and
# Actions jobs do not start when the account has no remaining Actions quota. Neither
# condition is a code defect, so this workflow must not be treated as the project's
# verification gate. The authoritative gate is `bash scripts/verify-local.sh`.
# See docs/operations/LOCAL_VERIFICATION.md.
#
# When Pages is unavailable for this repository, the job is skipped with a clear
# message instead of failing on every push to main.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Detect whether Pages is enabled for this repository
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/${{ github.repository }}/pages")"
          echo "http_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Skipping deployment (HTTP $status). A private repository on the free plan cannot host Pages. See docs/operations/GITHUB_PAGES_DEPLOYMENT.md."
          fi

      - name: Validate static site files
        if: steps.pages.outputs.enabled == 'true'
        shell: bash
        run: bash scripts/check-site-integrity.sh

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
