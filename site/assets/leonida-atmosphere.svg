      />
      <path
        d="M882 515h7v10h-7zm22 0h7v10h-7zm22 0h7v10h-7zm22 0h7v10h-7zm22 0h7v10h-7zm22 0h7v10h-7zM882 545h7v10h-7zm44 0h7v10h-7zm22 0h7v10h-7zm44 0h7v10h-7z"
