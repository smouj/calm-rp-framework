<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 900"
  fill="none"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Ilustración ambiental original para CALM</title>
  <desc id="desc">
    Horizonte costero nocturno con edificios, palmeras, luces y reflejos geométricos, creado para
    esta web.
  </desc>
  <defs>
    <radialGradient
      id="horizonGlow"
      cx="0"
      cy="0"
      r="1"
      gradientTransform="matrix(0 440 -690 0 1160 470)"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FF7898" stop-opacity=".42" />
      <stop offset=".42" stop-color="#895D9D" stop-opacity=".2" />
      <stop offset="1" stop-color="#101020" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="water" x1="1120" x2="1120" y1="598" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37304E" stop-opacity=".7" />
      <stop offset="1" stop-color="#101020" stop-opacity="0" />
    </linearGradient>
    <linearGradient
      id="edgeFade"
      x1="500"
      x2="1100"
      y1="450"
      y2="450"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="white" stop-opacity="0" />
      <stop offset=".44" stop-color="white" stop-opacity=".7" />
      <stop offset="1" stop-color="white" />
    </linearGradient>
    <mask id="sceneFade">
      <rect width="1600" height="900" fill="url(#edgeFade)" />
    </mask>
    <filter
      id="softGlow"
      x="-60%"
      y="-60%"
      width="220%"
      height="220%"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <style>
      .horizon-glow {
        animation: horizon-breathe 18s ease-in-out infinite alternate;
        transform-origin: 1160px 470px;
      }
      .water-lines {
        animation: water-drift 34s linear infinite;
      }
      .traffic-lights {
        animation: lights-glide 19s ease-in-out infinite alternate;
      }
      .window-glow {
        animation: window-pulse 7s ease-in-out infinite alternate;
      }
      @keyframes horizon-breathe {
        to {
          opacity: 0.72;
          transform: scale(1.05);
        }
      }
      @keyframes water-drift {
        to {
          transform: translateX(-72px);
        }
      }
      @keyframes lights-glide {
        to {
          transform: translateX(44px);
        }
      }
      @keyframes window-pulse {
        50% {
          opacity: 0.54;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g mask="url(#sceneFade)">
    <ellipse class="horizon-glow" cx="1160" cy="470" fill="url(#horizonGlow)" rx="690" ry="440" />
    <circle cx="1160" cy="474" r="126" fill="#FFAB8B" fill-opacity=".12" filter="url(#softGlow)" />
    <path d="M1065 478a95 95 0 1 1 190 0" stroke="#FFC4A7" stroke-opacity=".36" stroke-width="2" />
    <path d="M1078 480h164" stroke="#FFD0AE" stroke-opacity=".6" />

    <path d="M590 674V542h68v-46h41v-30h72v208H590Z" fill="#15172C" />
    <path d="M704 674V464h34v-54h31v42h28v-72h44v22h33v272H704Z" fill="#1B1D36" />
    <path d="M868 674V492h58v-82h14v-42h11v42h15v82h57v182H868Z" fill="#171A32" />
    <path d="M1038 674V466h50v-66h18v66h58v208h-126Z" fill="#1A1C35" />
    <path
      d="M1164 674V522h55v-32h24v-66h68v-36h25v44h42v-65h23v65h31v-44h39v76h48v210h-355Z"
