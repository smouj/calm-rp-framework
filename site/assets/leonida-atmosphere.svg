      />
      <path
        d="M1202 550h7v10h-7zm23 0h7v10h-7zm46-54h7v10h-7zm23 0h7v10h-7zm23 0h7v10h-7zm46 47h7v10h-7zm23 0h7v10h-7zm46-35h7v10h-7zm23 0h7v10h-7zm23 48h7v10h-7zm23 0h7v10h-7z"
      />
    </g>

    <g opacity=".75" stroke-linecap="round">
      <path d="M1378 650c-9-70 10-147 53-207" stroke="#69718A" stroke-width="8" />
      <path
        d="M1428 444c-37-6-68-21-88-47 41-1 72 9 95 31-12-34-13-63-2-86 22 24 32 53 30 86 15-32 37-54 67-64-8 34-26 60-57 77 38-7 72-1 99 20-36 14-70 15-103 2 25 20 40 45 44 75-31-16-53-39-67-70-3 37-17 68-42 92-5-38 0-71 15-99-27 25-56 37-88 35 24-29 54-47 82-52Z"
        fill="#20233D"
        stroke="#FF9BB2"
        stroke-opacity=".35"
