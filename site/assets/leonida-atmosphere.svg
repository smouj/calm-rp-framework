    <g opacity=".55" stroke-linecap="round">
      <path d="M1530 678c-7-47 4-100 30-143" stroke="#717B94" stroke-width="6" />
      <path
        d="M1558 535c-27-4-48-14-63-33 29-1 52 7 70 23-9-24-9-45-1-61 16 17 23 38 21 61 11-23 27-39 48-46-6 24-19 43-41 55 27-5 51 0 70 15-26 10-50 11-73 1 18 14 29 32 32 53-22-11-38-28-48-50-2 26-12 49-30 66-4-27 0-50 10-70-19 18-40 27-63 25 17-21 38-34 58-39Z"
