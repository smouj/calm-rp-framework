    <g class="traffic-lights">
      <path d="M762 667h442" stroke="#7583A0" stroke-opacity=".28" stroke-width="2" />
      <circle cx="843" cy="664" r="3" fill="#FF7C9F" />
      <circle cx="1092" cy="668" r="3" fill="#68DCD0" />
      <circle cx="1178" cy="666" r="2" fill="#FFC68F" />
    </g>
  </g>
</svg>
